<style>
/* ───────────── Design tokens ─────────────
   Light = drafting vellum · Dark = blueprint.
   A course colour is ONE hue (--h, set on the element); the theme only supplies saturation/lightness,
   so every theme (and the always-light export sheet) gets matching course colours. */
:root,[data-theme="light"]{
  --k:1;
  --bg:#EEF3F7; --grid-line:rgba(30,86,184,.075);
  --surface:#FFFFFF; --surface2:#F5F8FB;
  --ink:#14202E; --ink2:#4B5D70; --rule:#C6D3E0; --rule-strong:#14202E;
  --accent:#1E56B8; --accent-ink:#FFFFFF; --focus:#1E56B8;
  --head-bg:#14202E; --head-fg:#F2F6FA; --head-sub:#A9BACB;
  --tag-bg:#14202E; --tag-fg:#FFFFFF; --tag-j:#5E6E82;
  --empty:#F6F9FC; --shadow:0 1px 0 rgba(20,32,46,.06),0 8px 24px -12px rgba(20,32,46,.25);
  --bgS:80%; --bgL:88%;  --sbgS:72%; --sbgL:76%;  --fgS:70%; --fgL:17%;  --brS:70%; --brL:38%;
  --bar-track:rgba(20,32,46,.14); --bar-tick:#FFFFFF;
}
[data-theme="dark"]{
  --bg:#0A1F36; --grid-line:rgba(124,196,255,.085);
  --surface:#0F2A48; --surface2:#123256;
  --ink:#E4EEF9; --ink2:#9EB6D0; --rule:#2A4C75; --rule-strong:#7CC4FF;
  --accent:#7CC4FF; --accent-ink:#06223D; --focus:#7CC4FF;
  --head-bg:#07172A; --head-fg:#E4EEF9; --head-sub:#8FB0D3;
  --tag-bg:#E4EEF9; --tag-fg:#0A1F36; --tag-j:#8FA6C0;
  --empty:#0C2340; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);
  --bgS:42%; --bgL:22%;  --sbgS:48%; --sbgL:31%;  --fgS:80%; --fgL:88%;  --brS:80%; --brL:62%;
  --bar-track:rgba(255,255,255,.17); --bar-tick:#0F2A48;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--ink); background-color:var(--bg);
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:28px 28px;
  font:400 15px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}

/* ───────────── Page chrome ───────────── */
.wrap{max-width:1600px;margin:0 auto;padding:16px clamp(12px,2.6vw,30px) 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:46px;width:auto;flex:none}
.brand h1{margin:0;font-size:26px;line-height:1.05;font-weight:700;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.icons{display:flex;gap:8px}
.ibtn{width:42px;height:42px;display:grid;place-items:center;border:1.5px solid var(--rule);background:var(--surface);border-radius:4px;cursor:pointer;color:var(--ink)}
.ibtn:hover{border-color:var(--accent)}
.ibtn svg{width:20px;height:20px}
.ibtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
[data-theme="light"] .i-sun{display:none} [data-theme="dark"] .i-moon{display:none}

.controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;margin-bottom:16px;padding:14px;background:var(--surface);border:1.5px solid var(--rule);border-radius:4px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 18px;min-height:44px;font-weight:600;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 280px;min-width:0}
.field>span{font-size:13px;color:var(--ink2);font-weight:600}
.field select{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--ink);border-radius:4px;background:var(--surface);appearance:auto}
.export{position:relative;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:4px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:230px;background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;box-shadow:var(--shadow);padding:4px}
.menu[hidden]{display:none}
.menu button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:3px;cursor:pointer;min-height:44px}
.menu button:hover,.menu button:focus-visible{background:var(--surface2)}
.menu b{font-weight:600} .menu small{color:var(--ink2);font-size:12.5px}

.state{padding:44px 20px;text-align:center;color:var(--ink2);background:var(--surface);border:1.5px dashed var(--rule);border-radius:4px}
.state h2{margin:0 0 6px;color:var(--ink);font-size:20px}
.state p{margin:0 auto 14px;max-width:56ch}
.updated{margin:10px 2px 0;color:var(--ink2);font-size:13px}

/* ───────────── The routine sheet (screen and export) ───────────── */
.sheet{--fs:13.5px;background:var(--surface);color:var(--ink);font-size:var(--fs);border:2px solid var(--rule-strong);border-radius:3px;box-shadow:var(--shadow);overflow:hidden}

/* header in the university's layout: details left · logo + title centre · details right */
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px 22px;padding:14px 20px 12px;border-bottom:2px solid var(--rule-strong)}
.hd p{margin:0;font-size:1.04em;line-height:1.5}
.hd b{font-weight:700}
.hd-c{display:flex;align-items:center;justify-content:center;gap:14px}
.hd .logo{height:64px;width:auto;flex:none}
.hd-t h2,.hd-t h3{margin:0;font-weight:700;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.hd-t h2{font-size:1.62em;line-height:1.2}
.hd-t h3{font-size:1.42em;line-height:1.3;margin-top:3px}
.hd-r{justify-self:start}

.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;width:100%;table-layout:fixed;font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif}
.grid col.cday{width:96px}
.grid th,.grid td{border:1px solid var(--rule);padding:0;vertical-align:top}
.grid thead th{background:var(--head-bg);color:var(--head-fg);text-align:center;padding:5px 3px 6px;font-weight:600}
.grid thead .pn{display:block;font-size:1.5em;line-height:1;font-weight:700}
.grid thead .pb{display:block;margin-top:2px;font-size:.82em;color:var(--head-sub);font-variant-numeric:tabular-nums}
.grid th.day{position:sticky;left:0;z-index:2;background:var(--surface2);color:var(--ink);font-size:1.12em;font-weight:700;text-align:center;vertical-align:middle;padding:6px 4px}
.grid thead th.day{background:var(--head-bg);color:var(--head-fg);font-size:1.05em}
.grid td.empty{background:var(--empty)}
.grid tbody tr{height:1px}
.grid tbody td{height:1px}

.entry{
  display:flex;flex-direction:column;align-items:center;flex:1 1 auto;
  padding:4px 4px 7px;text-align:center;line-height:1.22;
  background:hsl(var(--h) calc(var(--bgS) * var(--k)) var(--bgL));color:hsl(var(--h) calc(var(--fgS) * var(--k)) var(--fgL));
}
.stack{display:flex;flex-direction:column;height:100%;min-height:100%}
.entry.sess{background:hsl(var(--h) calc(var(--sbgS) * var(--k)) var(--sbgL))}
.entry+.entry{border-top:1.5px dashed hsl(var(--h) calc(var(--brS) * var(--k)) var(--brL))}
.tags{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:1.25em;margin-bottom:1px}
.tag{display:inline-block;font-size:.8em;line-height:1.35;font-weight:700;padding:0 .4em;border-radius:2px;color:var(--tag-fg)}
.tag.e{background:var(--tag-bg)} .tag.j{background:var(--tag-j)}
.time{font-weight:700;font-size:1.06em}
.dl{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:1px .45em;margin:2px 0 3px}
.dur{font-size:.9em;font-weight:600;opacity:.85;white-space:nowrap}
.bar{position:relative;display:block;width:calc(3.4em*var(--n));max-width:100%;height:.58em;border-radius:2px;background:var(--bar-track);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:hsl(var(--h) calc(var(--brS) * var(--k)) var(--brL))}
.bar b{position:absolute;top:0;bottom:0;width:1.5px;background:var(--bar-tick)}
.title{font-weight:700;font-size:1.06em;line-height:1.18}
.code{font-weight:700;margin-top:1px}
.meta{opacity:.92}.meta b{font-weight:700}
.mr{display:flex;flex-wrap:wrap;justify-content:center;gap:0 .7em}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:9px 18px;border-top:2px solid var(--rule-strong);font-size:.95em}
.legend .lh{font-weight:700}
.chip{display:inline-block;padding:1px 8px;border-radius:2px;font-weight:600;background:hsl(var(--h) calc(var(--bgS) * var(--k)) var(--bgL));color:hsl(var(--h) calc(var(--fgS) * var(--k)) var(--fgL));border-left:4px solid hsl(var(--h) calc(var(--brS) * var(--k)) var(--brL))}
.chip.sess{background:hsl(var(--h) calc(var(--sbgS) * var(--k)) var(--sbgL))}
.legend .lt{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}

/* course teachers (student routine) */
.tt{border-top:2px solid var(--rule-strong);padding:10px 18px 12px}
.tt h3{margin:0 0 6px;font-size:1.12em;font-weight:700}
.tt-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start}
.tt table{width:100%;border-collapse:collapse;font-size:.92em;line-height:1.25}
.tt th{text-align:left;font-weight:700;color:var(--ink2);border-bottom:1.5px solid var(--rule-strong);padding:2px 6px 3px}
.tt td{border-bottom:1px solid var(--rule);padding:3px 6px;vertical-align:top}
.tt td.tc{border-left:5px solid hsl(var(--h) calc(var(--brS) * var(--k)) var(--brL));font-weight:700;white-space:nowrap}
.tt td.tp div+div,.tt td.th div+div{margin-top:2px}
.tt td.tp span{display:block;color:var(--ink2);font-size:.92em}
.tt td.th{white-space:nowrap}
.tt .cr{color:var(--ink2);white-space:nowrap}
.tt .tcards{display:none}
.tt-cols.one{grid-template-columns:1fr}
.notes{margin:0;padding:8px 18px 12px 38px;color:var(--ink2);font-size:.92em;border-top:1px solid var(--rule)}
.notes li{margin:2px 0}

/* phone layout: one card list per day */
.cards{padding:12px}
.cards .day{margin-bottom:16px}
.cards .day h3{margin:0 0 8px;padding:6px 10px;background:var(--head-bg);color:var(--head-fg);font-size:1.25em;border-radius:3px}
.pblock{display:grid;grid-template-columns:58px 1fr;gap:0 10px;margin-bottom:8px;align-items:stretch}
.pl{display:flex;flex-direction:column;align-items:center;padding-top:8px;color:var(--ink2);font-size:.9em;font-weight:600;border-right:2px solid var(--rule);padding-right:8px;text-align:center}
.pl strong{font-size:1.7em;line-height:1;color:var(--ink)}
.pblock .entries{display:flex;flex-direction:column;border:1px solid var(--rule);border-left:5px solid hsl(var(--h) calc(var(--brS) * var(--k)) var(--brL));border-radius:3px;overflow:hidden}
.pblock .entry{align-items:flex-start;text-align:left;padding:8px 10px 10px;font-size:1.06em}
.pblock .tags{justify-content:flex-start;gap:6px}
.pblock .dl{justify-content:flex-start}
.pblock .mr{justify-content:flex-start}

/* export sheet: A4 landscape (1754 x 1240 px, drawn at 2x = 3508 x 2480), always light, parked off-screen */
.paper{position:fixed;left:-20000px;top:0;width:1754px;height:1240px;padding:26px;box-sizing:border-box;background:#fff;color:#14202E;overflow:hidden}
.paper .sheet{box-shadow:none;border-radius:0;border-width:2px}
.paper .gridwrap{overflow:visible}
.paper table.grid{min-width:0!important;width:100%}
.paper .grid th.day{position:static}
.paper .hd{padding:12px 20px 10px;font-size:15px}
.paper .hd .logo{height:72px}
.paper .notes{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;list-style-position:inside;padding:6px 18px 10px}
.paper .entry{padding:3px 4px 6px;line-height:1.16}
.paper *{font-kerning:none;letter-spacing:0}
.paper .grid thead .pb{font-size:.78em;font-weight:600}

.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;max-width:min(92vw,520px);padding:10px 16px;background:var(--ink);color:var(--surface);border-radius:4px;font-weight:600;box-shadow:var(--shadow)}
.toast[hidden]{display:none}
.skeleton{height:320px;border:2px solid var(--rule);border-radius:3px;background:linear-gradient(90deg,var(--surface) 0,var(--surface2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton,.ibtn.spin svg{animation:none}}

@media (max-width:1100px){
  .sheet:not(.xp) .tt-cols{grid-template-columns:1fr}
  .sheet:not(.xp) .tt-cols table+table thead{display:none}
}
@media (max-width:900px){
  .sheet:not(.xp) .hd{grid-template-columns:1fr;justify-items:center}
  .sheet:not(.xp) .hd-c{order:-1;flex-direction:column;text-align:center}
  .sheet:not(.xp) .hd-l,.sheet:not(.xp) .hd-r{justify-self:stretch}
}
@media (max-width:640px){
  .brand h1{font-size:22px} .brand img{height:40px}
  .controls{padding:12px}
  .seg{width:100%}.seg button{flex:1}
  .export{margin-left:0;width:100%}.export .btn{width:100%;justify-content:center}
  .menu{left:0;right:0}
  .sheet:not(.xp) .tt .tablewrap{display:none}
  .sheet:not(.xp) .tt .tcards{display:block}
  .tcards .tc{padding:7px 0 8px 10px;border-bottom:1px solid var(--rule);border-left:5px solid hsl(var(--h) calc(var(--brS) * var(--k)) var(--brL));margin-bottom:6px}
  .tcards .tc b{display:block}
  .tcards .tc span{display:block;color:var(--ink2);font-size:.95em}
  .tcards .tc a{color:var(--accent);font-weight:600}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <img id="brandLogo" alt="KKBAU logo" width="35" height="46">
      <div><h1>Class routine</h1><p id="termLine">Loading…</p></div>
    </div>
    <div class="icons">
      <button class="ibtn" id="reloadBtn" type="button" aria-label="Reload routine from the sheet" title="Reload routine">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.6"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button class="ibtn" id="themeBtn" type="button" aria-label="Switch to dark theme" title="Switch theme">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>

  <section class="controls" aria-label="Choose a routine">
    <div class="seg" role="group" aria-label="Portal">
      <button type="button" id="segTeacher" aria-pressed="true">Teacher</button>
      <button type="button" id="segStudent" aria-pressed="false">Student</button>
    </div>
    <label class="field"><span id="pickLabel">Teacher</span>
      <select id="pick" disabled><option>Loading…</option></select>
    </label>
    <div class="export">
      <button class="btn" id="exportBtn" type="button" aria-haspopup="menu" aria-expanded="false" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
        Export as
      </button>
      <div class="menu" id="exportMenu" role="menu" hidden>
        <button type="button" role="menuitem" data-fmt="pdf"><b>PDF document</b><small>One A4 landscape page</small></button>
        <button type="button" role="menuitem" data-fmt="jpg"><b>JPG image</b><small>A4 landscape picture, 3508 × 2480 px</small></button>
        <button type="button" role="menuitem" data-fmt="docx"><b>Word document</b><small>Editable .docx, one page</small></button>
        <button type="button" role="menuitem" data-fmt="xlsx"><b>Excel workbook</b><small>Grid sheet and a flat list</small></button>
      </div>
    </div>
  </section>

  <main id="stage" aria-live="polite"><div class="skeleton"></div></main>
  <p class="updated" id="updated"></p>
</div>
<div class="toast" id="toast" role="status" hidden></div>

function overlap(a0, a1, b0, b1) { return Math.min(a1, b1) - Math.max(a0, b0); }

/* Turns the flat list of classes into period columns + day rows.
   sel = {mode:'teacher', key:'AAR'}  |  {mode:'student', sheet:'Evening', batch:'3-2'} */
function buildModel(data, sel) {
  var sheetTag = {}, sheetLabel = {};
  data.sheets.forEach(function (s) { sheetTag[s.key] = s.tag || ''; sheetLabel[s.key] = s.label; });
  var courses = data.courses || {};
  var dayOrder = (data.meta && data.meta.dayOrder) || ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  var picked = data.entries.filter(function (e) {
    return sel.mode === 'teacher'
      ? (e.teacher && e.teacher.toUpperCase() === String(sel.key).toUpperCase())
      : (e.sheet === sel.sheet && e.batch === sel.batch);
  });

  // 1 · one item per class; in the teacher view the same course + room in several batches becomes one JOINT class
  var items = picked.map(function (e) {
    return { sheet: e.sheet, day: e.day, code: e.code, teacher: e.teacher, room: e.room, batches: [e.batch],
             slots: e.slots.map(function (s) { return [s[0], s[1]]; }),
             start: e.slots[0][0], end: e.slots[e.slots.length - 1][1] };
  });
  var jointCount = 0;
  if (sel.mode === 'teacher') {
    var groups = {};
    items.forEach(function (it) { var k = [it.sheet, it.day, it.code, it.room, it.teacher].join('|'); (groups[k] = groups[k] || []).push(it); });
    items = [];
    Object.keys(groups).forEach(function (k) {
      var g = groups[k].sort(function (a, b) { return a.start - b.start; }), cur = null;
      g.forEach(function (it) {
        if (cur && overlap(cur.start, cur.end, it.start, it.end) > 0) {
          it.batches.forEach(function (b) { if (cur.batches.indexOf(b) < 0) cur.batches.push(b); });
          it.slots.forEach(function (s) { if (!cur.slots.some(function (x) { return x[0] === s[0] && x[1] === s[1]; })) cur.slots.push(s); });
          cur.slots.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
          cur.start = Math.min(cur.start, it.start); cur.end = Math.max(cur.end, it.end);
        } else { if (cur) items.push(cur); cur = it; }
      });
      if (cur) items.push(cur);
    });
    items.forEach(function (it) { it.batches.sort(); it.joint = it.batches.length > 1; if (it.joint) jointCount++; });
  } else { items.forEach(function (it) { it.joint = false; }); }

  var hues = assignHues(items.map(function (i) { return i.code; }), courses);
  items.forEach(function (it) {
    var c = courses[it.code] || {};
    it.title = c.title || '';
    it.sess = isSess(it.code, courses);
    it.hue = hues[baseKey(it.code, courses)];
    it.tag = sheetTag[it.sheet] || '';
    it.dur = it.end - it.start;
  });

  // 2 · inside a day, classes whose times overlap share one cell (stacked)
  var blocks = [];
  var allDays = dayOrder.slice();
  items.forEach(function (it) { if (allDays.indexOf(it.day) < 0) allDays.push(it.day); });
  allDays.forEach(function (day) {
    var list = items.filter(function (i) { return i.day === day; }).sort(function (a, b) { return a.start - b.start || a.end - b.end; });
    var cur = null;
    list.forEach(function (it) {
      if (cur && it.start < cur.end) { cur.items.push(it); cur.end = Math.max(cur.end, it.end); }
      else { cur = { day: day, items: [it], start: it.start, end: it.end }; blocks.push(cur); }
    });
  });

  // 3 · period columns: slots that overlap (or sit very close) in time share a column,
  //     but a day never puts two different slots in the same column
  var slots = [];
  blocks.forEach(function (b) {
    var seen = {};
    b.items.forEach(function (it) { it.slots.forEach(function (s) { var k = s[0] + '-' + s[1]; if (!seen[k]) { seen[k] = 1; slots.push({ block: b, s: s[0], e: s[1] }); } }); });
  });
  var di = function (d) { var i = allDays.indexOf(d); return i < 0 ? 99 : i; };
  slots.sort(function (a, b) { return a.s - b.s || a.e - b.e || di(a.block.day) - di(b.block.day); });
  var cols = [], last = {};
  slots.forEach(function (sl) {
    var day = sl.block.day, best = -1, bestOv = -1;
    cols.forEach(function (c, i) {
      if (c.days[day]) return;
      if (last[day] !== undefined && i <= last[day]) return;
      var ov = overlap(c.s, c.e, sl.s, sl.e);
      if (ov >= MIN_OVERLAP && ov > bestOv) { best = i; bestOv = ov; }
    });
    if (best < 0) { cols.push({ s: sl.s, e: sl.e, days: {} }); best = cols.length - 1; }
    var c = cols[best]; c.s = Math.min(c.s, sl.s); c.e = Math.max(c.e, sl.e); c.days[day] = 1;
    sl.col = best; last[day] = best;
  });
  blocks.forEach(function (b) {
    var cs = slots.filter(function (x) { return x.block === b; }).map(function (x) { return x.col; });
    b.c0 = Math.min.apply(null, cs); b.c1 = Math.max.apply(null, cs);
    b.items.sort(function (a, c) { return a.start - c.start || a.code.localeCompare(c.code); });
  });

  // 4 · rows
  var rows = [];
  allDays.forEach(function (day) {
    var bl = blocks.filter(function (b) { return b.day === day; }).sort(function (a, b) { return a.c0 - b.c0; });
    if (bl.length) rows.push({ day: day, blocks: bl });
  });

  var codes = {}; items.forEach(function (it) { codes[it.code] = it; });
  return {
    cols: cols.map(function (c, i) { return { n: i + 1, s: c.s, e: c.e }; }),
    rows: rows,
    sessions: items.length,
    jointCount: jointCount,
    legend: Object.keys(codes).sort().map(function (c) { var it = codes[c]; return { code: c, title: it.title || c, sess: it.sess, hue: it.hue }; }),
    tags: data.sheets.filter(function (s) { return s.tag; }).map(function (s) { return { tag: s.tag, label: s.label }; }),
    sheetLabel: sheetLabel
  };
}

function teacherInfo(data, acr) {
  var u = String(acr || '').toUpperCase();
  return (data.teachers || []).filter(function (t) {
    return t.acr.toUpperCase() === u || (t.aka || []).some(function (x) { return x.toUpperCase() === u; });
  })[0] || null;
}
function sortKey(t) {                                      // sort by the name, ignoring Dr./Md./Ms. …
  var n = (t.name || t.acr).replace(/^((dr|md|mr|mrs|ms|prof|professor)\.?\s+)+/i, '');
  return n.toLowerCase();
}
function teacherLabel(t) { var a = [t.acr].concat(t.aka || []).join(' / '); return t.name ? t.name + ' (' + a + ')' : a; }
function ordinal(n) { return ['', 'First', 'Second', 'Third', 'Fourth'][n] || String(n); }
function semesterName(batch) {
  var m = String(batch).match(/^(\d)-(\d)$/);
  return m ? ordinal(+m[1]) + ' Year ' + ordinal(+m[2]) + ' Semester' : batch;
}

/* The course → teacher table that goes under a student's routine */
function courseTeachers(data, model) {
  var map = {}, order = [];
  model.rows.forEach(function (r) { r.blocks.forEach(function (b) { b.items.forEach(function (it) {
    if (!map[it.code]) { map[it.code] = { code: it.code, title: it.title, hue: it.hue, sess: it.sess, credit: (data.courses[it.code] || {}).credit || null, teachers: [] }; order.push(it.code); }
    if (it.teacher && !map[it.code].teachers.some(function (t) { return t.acr === it.teacher; })) {
      var t = teacherInfo(data, it.teacher) || { acr: it.teacher, name: '', designation: '', affiliation: '', phone: '' };
      map[it.code].teachers.push(t);
    }
  }); }); });
  order.forEach(function (k) {
    var c = map[k];
    if (!c.teachers.length) ((data.courses[k] || {}).teachers || []).forEach(function (a) { var t = teacherInfo(data, a); if (t) c.teachers.push(t); });
  });
  return order.sort().map(function (k) { return map[k]; });
}

/* Header text, notes and (student) teacher table: shared by the page, PDF/JPG, Word and Excel */
function describe(data, sel, model) {
  var m = data.meta || {}, term = String(m.term || '').replace(/\s+/g, '-');
  var dept = m.departmentShort || m.department || '';
  var left = [['Department', dept]], right = [], who, teachers = null;
  if (m.program) left.push(['Program', m.program]);
  var plural = model.sessions + ' sessions a week' + (model.jointCount ? ' (joint classes counted once)' : '');
  if (sel.mode === 'teacher') {
    var t = teacherInfo(data, sel.key) || { acr: sel.key, name: '' };
    who = teacherLabel(t);
    left.push(['Semester', term]); left.push(['Classes', plural]);
    right.push(['Course Teacher', who]);
    if (t.designation) right.push(['Designation', t.designation]);
    if (t.affiliation) right.push(['Department', t.affiliation]);
    if (t.phone) right.push(['Cell', t.phone]);
  } else {
    who = (model.sheetLabel[sel.sheet] || sel.sheet) + ' ' + sel.batch;
    teachers = courseTeachers(data, model);
    var tn = {}; teachers.forEach(function (c) { c.teachers.forEach(function (x) { tn[x.acr] = 1; }); });
    left.push(['Semester', semesterName(sel.batch)]); left.push(['Classes', plural]);
    right.push(['Batch', who]); right.push(['Enrollment Semester', term]);
    right.push(['Courses', String(teachers.length)]); right.push(['Course Teachers', String(Object.keys(tn).length)]);
  }
  var notes = ['Periods group classes whose time frames overlap or are close; the exact time of every class is printed in its cell. A class that runs across several periods is one wide cell.'];
  if (model.jointCount) notes.push('Joint class: the routine lists the same course in the same room under more than one batch, so it is shown once with all its batches.');
  (m.notes || []).forEach(function (n) { notes.push(n); });
  return { org: m.institution || '', docTitle: 'Class Routine', left: left, right: right, notes: notes, who: who, teachers: teachers };
}

function metaLine(it, mode, data) {                        // "Batch 2-2 & 3-1"  or  "Teacher AAR"
  if (mode === 'teacher') return { k: it.batches.length > 1 ? 'Batches' : 'Batch', v: it.batches.join(' & ') };
  var t = it.teacher ? teacherInfo(data, it.teacher) : null;
  return { k: 'Teacher', v: it.teacher || '—', full: t && t.name ? t.name : '' };
}
function safeName(s) { return String(s).replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); }
/*CORE-END*/

/* ═════════════ 3 · HTML renderers ═════════════ */
function barHTML(it) {
  var n = Math.max(1, Math.ceil(it.dur / 60)), ticks = '';
  for (var k = 1; k < n; k++) ticks += '<b style="left:' + (k / n * 100) + '%"></b>';
  return '<span class="bar" style="--n:' + n + '" role="img" aria-label="' + esc(fmtDur(it.dur)) + '"><i style="width:' + (it.dur / (n * 60) * 100) + '%"></i>' + ticks + '</span>';
}
function entryHTML(it, mode, data) {
  var ml = metaLine(it, mode, data);
  var tags = '<div class="tags"><span>' + (it.tag ? '<span class="tag e" title="' + esc(it.tag === 'E' ? 'Evening class' : it.tag) + '">' + esc(it.tag) + '</span>' : '') +
             '</span>' + (it.joint ? '<span class="tag j" title="Same course and room shared by several batches">JOINT</span>' : '') + '</div>';
  var tl = ml.full ? ' title="' + esc(ml.full) + '"' : '';
  return '<div class="entry' + (it.sess ? ' sess' : '') + '" style="' + hs(it.hue) + '">' + tags +
    '<div class="time">' + esc(fmtRange(it.start, it.end)).replace('–', '–<wbr>') + '</div>' +
    '<div class="dl"><span class="dur">' + esc(fmtDur(it.dur)) + '</span>' + barHTML(it) + '</div>' +
    '<div class="title">' + esc(it.title || it.code) + '</div>' +
    '<div class="code">' + esc(it.code) + '</div>' +
    '<div class="mr"><span class="meta"' + tl + '>' + esc(ml.k) + ' <b>' + esc(ml.v) + '</b></span><span class="meta">Room <b>' + esc(it.room || '—') + '</b></span></div></div>';
}
function headerHTML(d) {
  var lines = function (a) { return a.map(function (r) { return '<p><b>' + esc(r[0]) + ':</b> ' + esc(r[1]) + '</p>'; }).join(''); };
  return '<header class="hd"><div class="hd-l">' + lines(d.left) + '</div>' +
    '<div class="hd-c"><img class="logo" src="' + LOGO + '" alt="KKBAU logo"><div class="hd-t"><h2>' + esc(d.org) + '</h2><h3>' + esc(d.docTitle) + '</h3></div></div>' +
    '<div class="hd-r">' + lines(d.right) + '</div></header>';
}
function legendHTML(model) {
  var h = '<div class="legend"><span class="lh">Colour = course</span>';
  model.legend.forEach(function (l) { h += '<span class="chip' + (l.sess ? ' sess' : '') + '" style="' + hs(l.hue) + '">' + esc(l.title) + '</span>'; });
  model.tags.forEach(function (t) { h += '<span class="lt"><span class="tag e">' + esc(t.tag) + '</span> ' + esc(t.label) + ' class</span>'; });
  if (model.jointCount) h += '<span class="lt"><span class="tag j">JOINT</span> same course and room, several batches</span>';
  h += '<span class="lt">Bar: each segment is 1 hour, the filled part is the class length</span></div>';
  return h;
}
function notesHTML(d) { return '<ol class="notes">' + d.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ol>'; }
function teachersHTML(d, cols) {
  if (!d.teachers || !d.teachers.length) return '';
  var tel = function (p) { return p ? '<a href="tel:' + esc(p.replace(/[^\d+]/g, '')) + '">' + esc(p) + '</a>' : ''; };
  var rows = d.teachers.map(function (c) {
    var tl = c.teachers.length ? c.teachers : [{ acr: '', name: '—' }];
    return '<tr style="' + hs(c.hue) + '"><td class="tc">' + esc(c.code) + '</td><td>' + esc(c.title || c.code) + (c.credit ? ' <span class="cr">(' + c.credit + ' cr)</span>' : '') + '</td>' +
      '<td class="tp">' + tl.map(function (t) { var sub = [t.designation, t.affiliation].filter(Boolean).join(', ');
        return '<div><b>' + esc(t.name || t.acr) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>'; }).join('') + '</td>' +
      '<td class="th">' + tl.map(function (t) { return '<div>' + esc(t.phone || '') + '</div>'; }).join('') + '</td></tr>';
  });
  var half = Math.ceil(rows.length / 2);
  var table = function (r) { return '<table><thead><tr><th>Code</th><th>Course</th><th>Teacher</th><th>Cell</th></tr></thead><tbody>' + r.join('') + '</tbody></table>'; };
  var cards = d.teachers.map(function (c) {
    var tl = c.teachers.length ? c.teachers : [{ acr: '', name: '—' }];
    return '<div class="tc" style="' + hs(c.hue) + '"><b>' + esc(c.code) + ' · ' + esc(c.title || '') + '</b>' + tl.map(function (t) {
      var sub = [t.designation, t.affiliation].filter(Boolean).join(', ');
      return '<span>' + esc(t.name || t.acr) + (sub ? ', ' + esc(sub) : '') + (t.phone ? ' · ' + tel(t.phone) : '') + '</span>'; }).join('') + '</div>';
  }).join('');
  var one = cols === 1 || rows.length < 2;
  return '<section class="tt"><h3>Course teachers</h3><div class="tablewrap tt-cols' + (one ? ' one' : '') + '">' + (one ? table(rows) : table(rows.slice(0, half)) + table(rows.slice(half))) + '</div><div class="tcards">' + cards + '</div></section>';
}

function gridHTML(model, mode, data) {
  var N = model.cols.length, h = '<div class="gridwrap"><table class="grid" style="min-width:' + (96 + N * 104) + 'px"><colgroup><col class="cday">';
  for (var i = 0; i < N; i++) h += '<col>';
  h += '</colgroup><thead><tr><th class="day" scope="col">Day</th>';
  model.cols.forEach(function (c) { h += '<th scope="col"><span class="pn">' + c.n + '</span><span class="pb">' + esc(fmtBand(c.s, c.e)) + '</span></th>'; });
  h += '</tr></thead><tbody>';
  model.rows.forEach(function (r) {
    h += '<tr><th class="day" scope="row">' + esc(r.day) + '</th>';
    var p = 0;
    r.blocks.forEach(function (b) {
      while (p < b.c0) { h += '<td class="empty"></td>'; p++; }
      var span = b.c1 - b.c0 + 1;
      h += '<td' + (span > 1 ? ' colspan="' + span + '"' : '') + '><div class="stack">' + b.items.map(function (it) { return entryHTML(it, mode, data); }).join('') + '</div></td>';
      p = b.c1 + 1;
    });
    while (p < N) { h += '<td class="empty"></td>'; p++; }
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}
function cardsHTML(model, mode, data) {
  var h = '<div class="cards">';
  model.rows.forEach(function (r) {
    h += '<section class="day"><h3>' + esc(r.day) + '</h3>';
    r.blocks.forEach(function (b) {
      var one = b.c0 === b.c1;
      h += '<div class="pblock" style="' + hs(b.items[0].hue) + '"><div class="pl"><span>' + (one ? 'Period' : 'Periods') + '</span><strong>' + (b.c0 + 1) + (one ? '' : '–' + (b.c1 + 1)) + '</strong></div>' +
           '<div class="entries">' + b.items.map(function (it) { return entryHTML(it, mode, data); }).join('') + '</div></div>';
    });
    h += '</section>';
  });
  return h + '</div>';
}
function sheetHTML(model, d, mode, data, opt) {
  opt = opt || {};
  var body = opt.cards ? cardsHTML(model, mode, data) : gridHTML(model, mode, data);
  return '<article class="sheet' + (opt.paper ? ' xp' : '') + '">' + headerHTML(d) + body + legendHTML(model) + teachersHTML(d, opt.ttCols) + notesHTML(d) + '</article>';
}

function b64bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }

async function buildDocx(docxLib, model, d, mode, data, barPng, logoB64) {
  var D = docxLib, FONT = 'Arial', NAVY = '1F2A44';
  var N = model.cols.length, hasTT = !!(d.teachers && d.teachers.length);
  var DAYW = 1000, TW = 15838, PW = Math.floor((TW - DAYW) / N);
  var base = hasTT ? (N >= 10 ? 12 : 13) : (N >= 10 ? 13 : N >= 7 ? 15 : 17);
  var line = { style: D.BorderStyle.SINGLE, size: 4, color: '9AA5B5' }, borders = { top: line, bottom: line, left: line, right: line };
  var none = { style: D.BorderStyle.NONE, size: 0, color: 'FFFFFF' }, noBorders = { top: none, bottom: none, left: none, right: none };
  var run = function (t, o) { o = o || {}; return new D.TextRun({ text: t, font: FONT, size: o.size || base, bold: o.bold, color: o.color, italics: o.italics, underline: o.underline ? {} : undefined,
    shading: o.shade ? { type: D.ShadingType.CLEAR, fill: o.shade, color: 'auto' } : undefined }); };
  var para = function (runs, al, extra) { return new D.Paragraph(Object.assign({ children: runs, alignment: al || D.AlignmentType.LEFT, spacing: { before: 0, after: 0 } }, extra || {})); };
  var center = D.AlignmentType.CENTER;

  var bars = {}, all = [];
  model.rows.forEach(function (r) { r.blocks.forEach(function (b) { b.items.forEach(function (it) { all.push(it); }); }); });
  for (var i = 0; i < all.length; i++) {
    var it = all[i], n = Math.max(1, Math.ceil(it.dur / 60)), key = n + '|' + it.dur + '|' + it.hue;
    if (!bars[key]) bars[key] = { n: n, data: await barPng(n, it.dur / (n * 60), lightColors(it.hue).bar) };
  }
  var cell = function (kids, w, o) { o = o || {}; return new D.TableCell({ children: kids, width: { size: w, type: D.WidthType.DXA }, borders: o.plain ? noBorders : borders, columnSpan: o.span,
    verticalAlign: o.top ? D.VerticalAlign.TOP : D.VerticalAlign.CENTER, shading: o.fill ? { type: D.ShadingType.CLEAR, fill: o.fill, color: 'auto' } : undefined,
    margins: { top: o.plain ? 0 : 20, bottom: o.plain ? 0 : 20, left: 40, right: 40 } }); };

  // header: details left | logo + title | details right  (the university's layout)
  var kv = function (a, sz) { return a.map(function (r) { return para([run(r[0] + ': ', { bold: true, size: sz }), run(r[1], { size: sz })], D.AlignmentType.LEFT, { spacing: { before: 0, after: 10 } }); }); };
  var hdr = new D.Table({ width: { size: TW, type: D.WidthType.DXA }, columnWidths: [4000, 800, 6900, 4138], borders: { top: none, bottom: none, left: none, right: none, insideHorizontal: none, insideVertical: none },
    rows: [new D.TableRow({ children: [
      cell(kv(d.left, 16), 4000, { plain: true }),
      cell([para([new D.ImageRun({ type: 'png', data: b64bytes(logoB64), transformation: { width: 42, height: 56 }, altText: { title: 'Logo', description: 'KKBAU logo', name: 'logo' } })], center)], 800, { plain: true }),
      cell([para([run(d.org, { bold: true, size: 26, underline: true })], center), para([run(d.docTitle, { bold: true, size: 24, underline: true })], center, { spacing: { before: 20, after: 0 } })], 6900, { plain: true }),
      cell(kv(d.right, 16), 4138, { plain: true })
    ] })] });

  var head = new D.TableRow({ tableHeader: true, children: [cell([para([run('Day', { bold: true, color: 'FFFFFF', size: 18 })], center)], DAYW, { fill: NAVY })].concat(
    model.cols.map(function (c) { return cell([para([run(String(c.n), { bold: true, color: 'FFFFFF', size: 22 })], center), para([run(fmtBand(c.s, c.e), { color: 'C7D2E8', size: 12 })], center)], PW, { fill: NAVY }); })) });

  function entryParas(it, first, inner) {
    var col = lightColors(it.hue), shade = first ? undefined : (it.sess ? col.bgS : col.bg);
    var sp = function (b, a) { return { before: b || 0, after: a || 0 }; };
    var ex = function (o) { return Object.assign({ shading: shade ? { type: D.ShadingType.CLEAR, fill: shade, color: 'auto' } : undefined }, o || {}); };
    var ml = metaLine(it, mode, data), bar = bars[Math.max(1, Math.ceil(it.dur / 60)) + '|' + it.dur + '|' + it.hue];
    var tagRuns = [it.tag ? run('\u00A0' + it.tag + '\u00A0', { bold: true, size: 13, color: 'FFFFFF', shade: NAVY }) : run('\u00A0', { size: 12 }), run('\t', { size: 11 })];
    if (it.joint) tagRuns.push(run('\u00A0JOINT\u00A0', { bold: true, size: 11, color: 'FFFFFF', shade: '64748B' }));

var $ = function (id) { return document.getElementById(id); };
var state = { data: null, mode: 'teacher', teacher: '', batch: '', model: null, desc: null, sel: null };
var KEY = { data: 'routine:data2', ui: 'routine:ui', theme: 'routine:theme' };
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
};
var narrow = window.matchMedia('(max-width: 820px)');

/* ---- theme ---- */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('themeBtn').setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'dark' ? '#0A1F36' : '#EEF3F7');
}
(function initTheme() {
  var saved = store.get(KEY.theme);
  applyTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
})();
$('themeBtn').addEventListener('click', function () {
  var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(t); store.set(KEY.theme, t);
});

/* ---- toast ---- */
var toastTimer;
function toast(msg, ms) {
  var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(function () { t.hidden = true; }, ms);
}

/* ---- loading data ---- */
function jsonp(url) {
  return new Promise(function (resolve, reject) {
    var cb = '__routine_cb_' + Date.now(), s = document.createElement('script');
    window[cb] = function (d) { resolve(d); cleanup(); };
    function cleanup() { delete window[cb]; s.remove(); }
    s.onerror = function () { cleanup(); reject(new Error('Could not reach the web app.')); };
    s.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}
async function fetchRoutine(force) {
  if (!API_URL || /PASTE_YOUR/.test(API_URL)) throw new Error('Set API_URL at the top of Index.html to your Apps Script web app URL.');
  var url = API_URL + (API_URL.indexOf('?') < 0 ? '?' : '&') + (force ? 'refresh=1&' : '') + 'v=2';
  var data;
  try {
    var res = await fetch(url, { cache: 'no-store', redirect: 'follow' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    data = await jsonp(url);                                  // fallback if the browser blocks the fetch
  }
  if (!data || !data.ok) throw new Error((data && data.error) || 'The web app returned no routine.');
  return data;
}
async function load(force, quiet) {
  $('reloadBtn').classList.add('spin');
  try {
    var data = await fetchRoutine(force);
    var changed = !state.data || state.data.version !== data.version;
    state.data = data;
    store.set(KEY.data, JSON.stringify(data));
    if (changed || force) { setupPickers(); render(); }

    if (force) toast('Routine reloaded.', 1800);
  } catch (err) {
    if (!state.data) showError(err.message); else if (!quiet) toast(err.message, 4000);
  } finally { $('reloadBtn').classList.remove('spin'); }
}
function showUpdated() {

  $('updated').textContent = d && !isNaN(d) ? 'Routine data from ' + d.toLocaleString([], { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';

function showError(msg) {

    }).join('');

      if (!opts.length) return;
      html += '<optgroup label="' + esc(s.label) + '">' + opts.map(function (b) {
        var v = b.sheet + '|' + b.batch;

function setMode(m) {

  if (state.mode === 'teacher') return state.teacher ? { mode: 'teacher', key: state.teacher } : null;
  if (!state.batch) return null;
  var p = state.batch.split('|'); return { mode: 'student', sheet: p[0], batch: p[1] };
}
function render() {
  var d = state.data; if (!d) return;
  var sel = currentSel(), stage = $('stage');
  state.sel = sel; state.model = null;
  $('exportBtn').disabled = true;
  if (!sel) {
    stage.innerHTML = '<div class="state"><h2>' + (state.mode === 'teacher' ? 'Pick a teacher' : 'Pick your batch') + '</h2><p>' +
      (state.mode === 'teacher' ? 'Choose a name above to see that teacher’s week, period by period.' : 'Choose a batch such as “Evening 3-2” to see every class for it, whoever teaches it.') + '</p></div>';
    return;
  }
  var model = buildModel(d, sel);
  if (!model.rows.length) {
    stage.innerHTML = '<div class="state"><h2>No classes found</h2><p>There are no classes in the sheet for this selection.</p></div>';
    return;
  }
  var desc = describe(d, sel, model);
  state.model = model; state.desc = desc;
  stage.innerHTML = sheetHTML(model, desc, sel.mode, d, { cards: narrow.matches });
  $('exportBtn').disabled = false;
}
narrow.addEventListener ? narrow.addEventListener('change', render) : narrow.addListener(render);
$('reloadBtn').addEventListener('click', function () { load(true); });

/* ---- export menu ---- */
var menu = $('exportMenu'), expBtn = $('exportBtn');
function closeMenu() { menu.hidden = true; expBtn.setAttribute('aria-expanded', 'false'); }
expBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  var open = menu.hidden; menu.hidden = !open; expBtn.setAttribute('aria-expanded', String(open));
  if (open) menu.querySelector('button').focus();
});
document.addEventListener('click', function (e) { if (!menu.hidden && !menu.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !menu.hidden) { closeMenu(); expBtn.focus(); } });
menu.addEventListener('click', function (e) {
  var b = e.target.closest('button[data-fmt]'); if (!b) return;
  closeMenu(); doExport(b.getAttribute('data-fmt'));
});

var LIBS = {
  html2canvas: { test: function () { return window.html2canvas; }, urls: ['https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'] },
  jspdf: { test: function () { return window.jspdf && window.jspdf.jsPDF; }, urls: ['https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'] },
  docx: { test: function () { return window.docx; }, urls: ['https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js', 'https://unpkg.com/docx@8.5.0/build/index.umd.js'] },
  exceljs: { test: function () { return window.ExcelJS; }, urls: ['https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'] }
};
function loadScript(url) {
  return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = url; s.onload = res; s.onerror = function () { s.remove(); rej(new Error('blocked')); }; document.head.appendChild(s); });
}
async function useLib(name) {
  var L = LIBS[name]; if (L.test()) return L.test();
  for (var i = 0; i < L.urls.length; i++) { try { await loadScript(L.urls[i]); if (L.test()) return L.test(); } catch (e) { /* try next */ } }
  throw new Error('Could not load the ' + name + ' library. Check your internet connection and try again.');
}
function download(blob, name) {
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
}
function barPng(hours, ratio, hex) {
  var S = 3, W = hours * 56 * S, H = 7 * S, c = document.createElement('canvas'); c.width = W; c.height = H;
  var g = c.getContext('2d'), r = H / 2 - 1;
  function rr(x, y, w, h) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
  g.fillStyle = '#E2E8F0'; rr(0, 0, W, H); g.fill();
  g.fillStyle = '#' + hex; rr(0, 0, Math.max(H, W * ratio), H); g.fill();
  g.strokeStyle = '#FFFFFF'; g.lineWidth = S;
  for (var k = 1; k < hours; k++) { g.beginPath(); g.moveTo(k * 56 * S, 0); g.lineTo(k * 56 * S, H); g.stroke(); }
  g.strokeStyle = '#94A3B8'; g.lineWidth = S / 2; rr(S / 4, S / 4, W - S / 2, H - S / 2); g.stroke();
  return new Promise(function (res) { c.toBlob(function (b) { b.arrayBuffer().then(function (a) { res(new Uint8Array(a)); }); }, 'image/png'); });
}

/* The export sheet is an A4 landscape page (1754 x 1240 px, drawn at 2x = 3508 x 2480 px), always in the light theme,
   built off-screen. Font size (and one or two columns for the teacher table) are tried and the layout with the
   largest readable text that fits the page is used; spare height is shared between the day rows. */
var PAGE_W = 1754, PAGE_H = 1240, PAGE_PAD = 26;
function makeHolder(ttCols, fs) {
  var holder = document.createElement('div'); holder.className = 'paper'; holder.setAttribute('data-theme', 'light');
  holder.innerHTML = sheetHTML(state.model, state.desc, state.sel.mode, state.data, { paper: true, ttCols: ttCols });
  holder.querySelector('.sheet').style.setProperty('--fs', fs + 'px');
  document.body.appendChild(holder);
  return holder;
}
function paperFits(ttCols, fs) {
  var h = makeHolder(ttCols, fs), sheet = h.querySelector('.sheet'), H = sheet.offsetHeight;
  var bad = Array.prototype.some.call(h.querySelectorAll('.entry,.entry .time,.entry .title,.entry .code,.entry .meta,.tt td,.grid,.hd-r,.hd-l'), function (el) { return el.scrollWidth > el.clientWidth + 1; });
  h.remove();
  return !bad && H <= PAGE_H - 2 * PAGE_PAD;
}
function bestPaper() {
  var tt = !!(state.desc.teachers && state.desc.teachers.length), best = null;
  var sizes = []; for (var f = 24; f >= 9; f -= 0.5) sizes.push(f);
  (tt ? [2, 1] : [1]).forEach(function (cols) {
    var lo = 0, hi = sizes.length - 1, found = -1;               // sizes run from large to small: find the first that fits
    while (lo <= hi) { var mid = (lo + hi) >> 1; if (paperFits(cols, sizes[mid])) { found = mid; hi = mid - 1; } else lo = mid + 1; }
    if (found >= 0 && (!best || sizes[found] > best.fs + 0.01)) best = { cols: cols, fs: sizes[found] };
  });
  return best || { cols: tt ? 2 : 1, fs: 9 };
}
async function renderCanvas() {
  var html2canvas = await useLib('html2canvas');
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  var spec = bestPaper(), holder = makeHolder(spec.cols, spec.fs);
  try {
    var sheet = holder.querySelector('.sheet'), avail = PAGE_H - 2 * PAGE_PAD;
    var rows = holder.querySelectorAll('.grid tbody tr'), extra = avail - sheet.offsetHeight;
    if (extra > 4 && rows.length) {                              // spread spare height over the day rows
      var per = Math.floor(extra * 0.98 / rows.length);
      Array.prototype.forEach.call(rows, function (tr) { tr.style.height = (tr.offsetHeight + per) + 'px'; });
    }
    return await html2canvas(holder, { scale: 2, width: PAGE_W, height: PAGE_H, windowWidth: PAGE_W, windowHeight: PAGE_H, backgroundColor: '#ffffff', useCORS: true, logging: false });
  } finally { holder.remove(); }
}
async function doExport(fmt) {
  if (!state.model) return;
  var base = 'Routine_' + safeName(state.sel.mode === 'teacher' ? state.sel.key : state.sel.sheet + '_' + state.sel.batch) + '_' + safeName(state.data.meta.term || 'term');
  try {
    toast('Preparing ' + ({ pdf: 'PDF', jpg: 'image', docx: 'Word file', xlsx: 'Excel file' })[fmt] + '…');
    if (fmt === 'jpg' || fmt === 'pdf') {
      var canvas = await renderCanvas();
      if (fmt === 'jpg') {
        var blob = await new Promise(function (r) { canvas.toBlob(r, 'image/jpeg', 0.93); });
        download(blob, base + '.jpg');
      } else {
        var jsPDF = await useLib('jspdf');
        var pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4', compress: true });
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 841.89, 595.28, undefined, 'FAST');
        pdf.setProperties({ title: 'Class routine – ' + state.desc.who });
        download(pdf.output('blob'), base + '.pdf');
      }
    } else if (fmt === 'docx') {
      download(await buildDocx(await useLib('docx'), state.model, state.desc, state.sel.mode, state.data, barPng, LOGO_B64), base + '.docx');
    } else if (fmt === 'xlsx') {
      download(await buildXlsx(await useLib('exceljs'), state.model, state.desc, state.sel.mode, state.data, LOGO_B64), base + '.xlsx');
    }
    toast('Downloaded ' + fmt.toUpperCase() + '.', 2200);
  } catch (err) { toast((err && err.message) || 'Export failed.', 5000); }
}

/* ---- start ---- */
restoreUI();
var cached = store.get(KEY.data);
if (cached) { try { state.data = JSON.parse(cached); setupPickers(); render(); showUpdated(); } catch (e) { state.data = null; } }
load(false, !!state.data);
})();
</script>
